name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The Play upload key comes from repository secrets (see playstore/README.md).
      # When they are not set, release builds are signed with the debug key instead.
      - name: Restore upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release builds will be signed with the Play upload key."
          else
            echo "::notice::No upload key secrets; release builds use the debug key and cannot be uploaded to Play."
          fi

      - name: Build APKs and Play bundle
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease lintDebug

      - name: Show bundle package name and signing certificate
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          echo "Package name(s) in the bundle manifest:"
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -oE 'io\.github\.[a-z0-9_.]+' | sort -u
          echo "Bundle signing certificate:"
          keytool -printcert -jarfile "$AAB" | grep -E 'Owner:|SHA1:'
          echo "Release APK signing certificate (use the release APK for any ownership check):"
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E 'Owner:|SHA1:' || true

      # Name the downloads after the version, e.g. kiss-ai-4.9-40-release.apk inside kiss-ai-apks-4.9-40.
      - name: Name outputs with the version
        run: |
          NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          VER="$NAME-$CODE"
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist/apks dist/bundle
          cp app/build/outputs/apk/release/app-release.apk "dist/apks/kiss-ai-$VER-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/apks/kiss-ai-$VER-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/bundle/kiss-ai-$VER-release.aab"
          ls -l dist/apks dist/bundle

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kiss-ai-apks-${{ env.VER }}
          path: android/dist/apks/*.apk

      - name: Upload Play bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: kiss-ai-play-bundle-${{ env.VER }}
          path: android/dist/bundle/*.aab

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
