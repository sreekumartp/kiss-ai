name: Publish K.I.S.S AI web app to GitHub Pages

# Publishes the offline web build (the same page the Android app bundles)
# to https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
    paths:
      - "android/app/src/main/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and upload in one job, deploy in a second one. Deploying in the same
  # job as the upload can fail with "No artifacts named github-pages were found"
  # because the new artifact is not listed yet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r android/app/src/main/assets/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
