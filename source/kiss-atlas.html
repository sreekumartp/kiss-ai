/* ---------- Horizontal scroll bar for the map ---------- */
const hs = document.getElementById("hscroll"), hthumb = document.getElementById("hthumb");
function hGeom(t){
  const b = bounds(), W = svg.node().getBoundingClientRect().width, track = hs.clientWidth;
  const left = t.x + t.k*b.x0, width = t.k*(b.x1-b.x0);
  return {W, track, left, width};
}
function updateHScroll(t){
  if(!hs || !nodes[0] || nodes[0].x===undefined) return;
  const g = hGeom(t); if(!g.W || !g.track) return;
  if(g.width <= g.W){ hthumb.style.left="0px"; hthumb.style.width=g.track+"px"; hs.setAttribute("aria-valuenow","0"); return; }
  const tw = Math.max(28, g.track * g.W / g.width);
  const frac = Math.min(1, Math.max(0, -g.left / (g.width - g.W)));
  hthumb.style.width = tw + "px";
  hthumb.style.left = (frac * (g.track - tw)) + "px";
  hs.setAttribute("aria-valuenow", String(Math.round(frac*100)));
}
// Move the map so that the given fraction (0 = left edge, 1 = right edge) is in view.
function hScrollTo(frac, anim=false){
  const t = d3.zoomTransform(svg.node()), g = hGeom(t), b = bounds();
  if(g.width <= g.W) return;
  frac = Math.min(1, Math.max(0, frac));
  const x = -(frac * (g.width - g.W)) - t.k*b.x0;
  const nt = d3.zoomIdentity.translate(x, t.y).scale(t.k);
  (anim ? svg.transition().duration(250) : svg).call(zoom.transform, nt);
}
let hDrag = null;
hthumb.addEventListener("pointerdown", ev=>{
  ev.preventDefault(); ev.stopPropagation();
  const g = hGeom(d3.zoomTransform(svg.node())), tw = hthumb.offsetWidth;
  hDrag = {x0: ev.clientX, left0: hthumb.offsetLeft, range: Math.max(1, g.track - tw)};
  hthumb.classList.add("drag"); hthumb.setPointerCapture(ev.pointerId);
});
hthumb.addEventListener("pointermove", ev=>{ if(!hDrag) return; hScrollTo((hDrag.left0 + ev.clientX - hDrag.x0) / hDrag.range); });
const hEnd = ev=>{ if(!hDrag) return; hDrag=null; hthumb.classList.remove("drag"); try{ hthumb.releasePointerCapture(ev.pointerId); }catch(e){} };
hthumb.addEventListener("pointerup", hEnd); hthumb.addEventListener("pointercancel", hEnd);
hs.addEventListener("pointerdown", ev=>{
  if(ev.target===hthumb) return;
  const r = hs.getBoundingClientRect(), tw = hthumb.offsetWidth;
  hScrollTo((ev.clientX - r.left - tw/2) / Math.max(1, r.width - tw), true);
});
hs.addEventListener("keydown", ev=>{
  const cur = (+hs.getAttribute("aria-valuenow")||0)/100;
  const step = {ArrowRight:.05, ArrowLeft:-.05, PageDown:.25, PageUp:-.25}[ev.key];
  if(step!==undefined){ ev.preventDefault(); hScrollTo(cur+step, true); }
  if(ev.key==="Home"){ ev.preventDefault(); hScrollTo(0, true); }
  if(ev.key==="End"){ ev.preventDefault(); hScrollTo(1, true); }
});
window.addEventListener("resize", ()=>{ updateHScroll(d3.zoomTransform(svg.node())); clearTimeout(window._fr); window._fr=setTimeout(()=>{ if(focusActive()) applyHighlight(); }, 250); });

/* ---------- Account and cloud sync (Firebase, optional) ---------- */
// Signed out, everything stays on this device as before. Signed in, all "atlas-" keys are
// mirrored to Firestore at users/{uid} and kept in sync across devices.
const SYNC_SKIP = new Set(["atlas-view"]);
const sync = { state:"init", user:null, db:null, auth:null, unsub:null, applying:false, timer:null, last:null, msg:"" };
const syncKey = k => typeof k==="string" && k.startsWith("atlas-") && !SYNC_SKIP.has(k);
try{
  const P = Storage.prototype, _set = P.setItem, _rem = P.removeItem;
  P.setItem = function(k,v){ _set.call(this,k,v); if(this===window.localStorage && syncKey(k)) queueSync(); if(this===window.localStorage && typeof k==="string" && (k.startsWith("atlas-stage-") || k==="atlas-commit")) queueCommunity(); };
  P.removeItem = function(k){ _rem.call(this,k); if(this===window.localStorage && syncKey(k)) queueSync(); };
}catch(e){}
function localSnapshot(){ const o={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(syncKey(k)) o[k]=localStorage.getItem(k); } }catch(e){} return o; }
// Merge device data into account data: higher rung wins, ticked subtopics combine,
// non-empty success definitions and account settings are kept.
function mergeProgress(local, cloud){
  const out = Object.assign({}, cloud), rank = v => ({i:0,k:1,s:2,"$":3})[v] ?? -1;
  Object.entries(local).forEach(([k,v])=>{
    if(!(k in out)){ out[k]=v; return; }
    if(k.startsWith("atlas-stage-")) out[k] = rank(v) > rank(out[k]) ? v : out[k];
    else if(k.startsWith("atlas-done-")){ try{ out[k] = JSON.stringify([...new Set([...JSON.parse(out[k]||"[]"), ...JSON.parse(v||"[]")])].sort((a,b)=>a-b)); }catch(e){} }
    else if(k.startsWith("atlas-mysucc-")) out[k] = (out[k]||"").trim() ? out[k] : v;
    else if(k.startsWith("atlas-myres-")){ try{ const a=JSON.parse(out[k]||"[]"), seen=new Set(a.map(r=>r.u)); JSON.parse(v||"[]").forEach(r=>{ if(r && !seen.has(r.u)){ a.push(r); seen.add(r.u); } }); out[k]=JSON.stringify(a); }catch(e){} }
  });
  return out;
}
function applyLocal(data){
  sync.applying = true;
  try{
    Object.keys(localSnapshot()).forEach(k=>{ if(!(k in data)) localStorage.removeItem(k); });
    Object.entries(data).forEach(([k,v])=>{ if(syncKey(k) && typeof v==="string" && localStorage.getItem(k)!==v) localStorage.setItem(k,v); });
  }catch(e){}
  sync.applying = false;
  rerenderAll();
  const typing = document.activeElement && /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName) && sheet.contains(document.activeElement);
  if(!modal.hidden && modalId && !typing) openModal(modalId, true);
}
function setSync(state, msg){ sync.state=state; if(msg!==undefined) sync.msg=msg; document.querySelectorAll("#acctStatus,.acctstatus").forEach(a=>a.textContent=syncStatusText()); }
function syncStatusText(){
  if(sync.state==="saving") return "Saving…";
  if(sync.state==="synced") return "Synced" + (sync.last ? " · " + sync.last.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "");
  if(sync.state==="offline") return "Offline. Changes will sync when you reconnect.";
  return sync.msg || "";
}
function queueSync(){
  if(!sync.user || sync.applying) return;
  clearTimeout(sync.timer); setSync("saving");
  sync.timer = setTimeout(pushCloud, 1200);
}
function userDoc(){ return sync.db.collection("users").doc(sync.user.uid); }
async function pushCloud(){
  if(!sync.user) return;
  try{
    await userDoc().set({ data: localSnapshot(), updatedAt: firebase.firestore.FieldValue.serverTimestamp(), app:"kiss-ai", v:1 });
    sync.last = new Date(); setSync("synced");
  }catch(e){ setSync(navigator.onLine===false ? "offline" : "error", "Couldn't save to your account. It will retry on your next change."); }
}
async function startSync(){
  setSync("saving", "");
  try{
    const snap = await userDoc().get();
    const cloud = (snap.exists && snap.data() && snap.data().data) || {};
    const merged = mergeProgress(localSnapshot(), cloud);
    applyLocal(merged);
    await pushCloud();
    if(sync.unsub) sync.unsub();
    sync.unsub = userDoc().onSnapshot(d=>{
      if(d.metadata.hasPendingWrites || !d.exists) return;
      const data = (d.data() && d.data().data) || {};
      if(JSON.stringify(data) !== JSON.stringify(localSnapshot())){ applyLocal(data); sync.last=new Date(); setSync("synced"); }
    }, ()=>setSync("error", "Live sync stopped. Reopen the app to reconnect."));
  }catch(e){ setSync("error", "Couldn't reach your account. Your progress is still saved on this device."); }
}
function stopSync(){ if(sync.unsub){ sync.unsub(); sync.unsub=null; } clearTimeout(sync.timer); }
function loadScript(src){ return new Promise((res,rej)=>{ const el=document.createElement("script"); el.src=src; el.onload=res; el.onerror=()=>rej(new Error(src)); document.head.appendChild(el); }); }
async function initSync(){
  if(typeof window.KISS_FIREBASE_CONFIG === "undefined"){ setSync("unavailable"); return; }
  if(!window.KISS_FIREBASE_CONFIG){ setSync("unconfigured"); return; }
  try{
    if(!window.firebase) for(const f of ["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js"]) await loadScript("firebase/"+f);
    firebase.initializeApp(window.KISS_FIREBASE_CONFIG);
    try{ if(localStorage.getItem("kiss-emulator")==="1"){ firebase.auth().useEmulator("http://127.0.0.1:9099"); firebase.firestore().useEmulator("127.0.0.1", 8080); } }catch(e){}
    sync.auth = firebase.auth(); sync.db = firebase.firestore();
    setSync("signedout", "");
    sync.auth.onAuthStateChanged(u=>{
      sync.user = u || null;
      if(u) startSync(); else { stopSync(); setSync("signedout", ""); }
      refreshAccountUI();
      if(state.view==="groups") openGroupsView();
    });
    if(!window.AtlasNative) sync.auth.getRedirectResult().catch(e=>setSync("signedout", authError(e)));
  }catch(e){ setSync("error", "Sign-in couldn't load. Check your connection and reopen the app."); }
  refreshAccountUI();
}
function refreshAccountUI(){
  document.querySelectorAll("#l-acct").forEach(x=>x.outerHTML = landingAccountHTML());
  const a=document.getElementById("acct"); if(a) a.outerHTML = accountSectionHTML();
  if(state.view==="home") renderHome(); else if(!state.sel && !state.role) renderPanel();
}
function syncFooter(){
  if(sync.user) return `Your progress syncs to your account (${esc(sync.user.email||"signed in")}).`;
  if(sync.state==="signedout") return `Progress is saved on this device. Sign in from Settings to sync it across devices.`;
  return `Progress is saved on this device; back it up in Settings.`;
}
function authError(e){
  const c = (e && e.code) || "";
  return ({
    "auth/invalid-email":"That email address doesn't look right.",
    "auth/missing-password":"Enter your password.",
    "auth/weak-password":"Use a password of at least 6 characters.",
    "auth/email-already-in-use":"An account with this email already exists. Sign in instead.",
    "auth/invalid-credential":"Email or password is incorrect.",
    "auth/wrong-password":"Email or password is incorrect.",
    "auth/user-not-found":"No account with this email. Create one instead.",
    "auth/too-many-requests":"Too many attempts. Wait a few minutes and try again.",
    "auth/network-request-failed":"No connection. Check your internet and try again.",
    "auth/popup-closed-by-user":"Google sign-in was closed before it finished.",
    "auth/unauthorized-domain":"This website isn't on the Firebase authorized domains list yet."
  })[c] || ((e && e.message) || "Something went wrong. Try again.");
}
const PRIVACY_URL = "https://sreekumartp.github.io/kiss-ai/privacy.html";
const DELETE_URL = "https://sreekumartp.github.io/kiss-ai/delete-account.html";
// Opened from the account-deletion page: go straight to the delete step in Settings.
function openDeleteAccount(){
  if(sync.user) sync.confirmDelete=true;
  openSettings();
  const a=document.getElementById("acct"); if(a) a.scrollIntoView({block:"start"});
  if(!sync.user) setSync(sync.state, "Sign in below, then choose Delete account.");
}
function accountSectionHTML(){
  let body;
  if(sync.state==="unavailable") body = `<p class="note" style="margin:0">Sign-in and sync work in the web app and the Android app.</p>`;
  else if(sync.state==="unconfigured") body = `<p class="note" style="margin:0">Sign-in isn't set up for this copy yet. Add a Firebase config to <code>firebase-config.js</code> to turn it on.</p>`;
  else if(sync.user) body = `<p style="margin:0">Signed in as <b>${esc(sync.user.email||"your account")}</b></p>
      <p class="status" id="acctStatus" role="status">${esc(syncStatusText())}</p>
      <div class="btnrow"><button class="btn" data-set="signout">Sign out</button><button class="btn danger" data-set="delask">Delete account</button></div>
      ${sync.confirmDelete ? `<div class="delbox"><p><b>Delete your account and all synced progress?</b> This can't be undone. A copy of your progress stays on this device.</p>
        <div class="btnrow"><button class="btn dangerfill" data-set="deldo">Yes, delete my account</button><button class="btn" data-set="delno">Cancel</button></div></div>` : ""}
      <p class="note">Signing out keeps a copy of your progress on this device.</p>`;
  else body = `<p class="note" style="margin:0 0 10px">Sign in to keep your progress in sync on every device.</p>
      ${window.AtlasNative ? "" : `<div class="btnrow" style="margin-top:0"><button class="btn primary" data-set="google">Continue with Google</button></div><p class="note" style="margin:10px 0 6px">or use email</p>`}
      <form id="acctForm" class="acctform" autocomplete="on">
        <input id="acctEmail" type="email" autocomplete="username" placeholder="Email" required>
        <input id="acctPass" type="password" autocomplete="current-password" placeholder="Password (6+ characters)" minlength="6">
        <div class="btnrow"><button class="btn ${window.AtlasNative?"primary":""}" data-set="signin" type="submit">Sign in</button><button class="btn" data-set="signup" type="button">Create account</button><button class="btn" data-set="reset" type="button">Forgot password</button></div>
      </form>
      <p class="status" id="acctStatus" role="status">${esc(syncStatusText())}</p>`;
  return `<section id="acct"><label class="sl">Account and sync</label>${body}
    <p class="note"><a href="${PRIVACY_URL}" target="_blank" rel="noopener noreferrer">Privacy policy ↗</a> · <a href="${DELETE_URL}" target="_blank" rel="noopener noreferrer">Delete your account or request deletion ↗</a></p></section>`;
}
// Sign-up and sign-in on the landing screen (phone Home, desktop welcome panel).
function hideSignin(){ try{ return localStorage.getItem("kiss-hide-signin")==="1"; }catch(e){ return false; } }
function landingAccountHTML(){
  if(["unavailable","unconfigured"].includes(sync.state)) return `<div id="l-acct"></div>`;
  if(sync.user) return `<div id="l-acct" class="card landacct signedin"><p style="margin:0"><span class="dotok" aria-hidden="true"></span>Signed in as <b>${esc(sync.user.email||"your account")}</b> · <span class="acctstatus" role="status">${esc(syncStatusText())}</span></p></div>`;
  if(hideSignin()) return `<div id="l-acct" class="landmini"><button class="linkbtn" data-acct="show">Sign in to sync your progress</button></div>`;
  return `<div id="l-acct" class="card landacct">
    <h2>Save your progress</h2>
    <p class="none">Create a free account or sign in to keep your rungs, notes and links in sync on every device. Everything also works without an account.</p>
    ${window.AtlasNative ? "" : `<div class="btnrow"><button class="btn primary" data-acct="google">Continue with Google</button></div><p class="note" style="margin:10px 0 6px">or use email</p>`}
    <form id="l-acctForm" class="acctform" autocomplete="on">
      <label class="sr" for="l-acctEmail">Email</label>
      <input id="l-acctEmail" type="email" autocomplete="username" placeholder="Email" required>
      <label class="sr" for="l-acctPass">Password</label>
      <input id="l-acctPass" type="password" autocomplete="current-password" placeholder="Password (6+ characters)" minlength="6">
      <div class="btnrow"><button class="btn primary" data-acct="signup" type="button">Create account</button><button class="btn" type="submit">Sign in</button><button class="linkbtn" data-acct="reset" type="button">Forgot password</button></div>
    </form>
    <p class="status acctstatus" role="status">${esc(sync.msg||"")}</p>
    <p class="note" style="margin-top:4px"><button class="linkbtn" data-acct="hide">Not now</button> · <a href="${PRIVACY_URL}" target="_blank" rel="noopener noreferrer">Privacy ↗</a></p>
  </div>`;
}
document.addEventListener("click", ev=>{
  const b=ev.target.closest("#l-acct [data-acct]"); if(!b) return;
  const k=b.dataset.acct;
  if(k==="hide"||k==="show"){ try{ k==="hide" ? localStorage.setItem("kiss-hide-signin","1") : localStorage.removeItem("kiss-hide-signin"); }catch(e){}
    const el=document.querySelectorAll("#l-acct"); el.forEach(x=>x.outerHTML=landingAccountHTML()); if(k==="show"){ const e=document.getElementById("l-acctEmail"); if(e) e.focus(); } return; }
  if(!sync.auth){ setSync(sync.state, "Sign-in is still loading. Try again in a moment."); return; }
  accountAction(k, "l-", b.closest("#l-acct"));
});
document.addEventListener("submit", ev=>{ if(ev.target.id==="l-acctForm"){ ev.preventDefault(); if(!sync.auth){ setSync(sync.state, "Sign-in is still loading. Try again in a moment."); return; } accountAction("signin","l-", ev.target.closest("#l-acct")); } });
async function accountAction(k, prefix="", root=document){
  const field = id => root.querySelector("#"+prefix+id) || {};
  const email = field("acctEmail").value||"", pass = field("acctPass").value||"";
  const say = m => setSync(sync.state, m);
  try{
    if(k==="google"){
      const pr = new firebase.auth.GoogleAuthProvider();
      try{ await sync.auth.signInWithPopup(pr); }
      catch(e){ if(e.code==="auth/popup-blocked" || e.code==="auth/operation-not-supported-in-this-environment") await sync.auth.signInWithRedirect(pr); else throw e; }
    }
    if(k==="signin"){ say("Signing in…"); await sync.auth.signInWithEmailAndPassword(email.trim(), pass); }
    if(k==="signup"){ say("Creating your account…"); await sync.auth.createUserWithEmailAndPassword(email.trim(), pass); }
    if(k==="reset"){ if(!email.trim()) return say("Enter your email first, then tap Forgot password."); await sync.auth.sendPasswordResetEmail(email.trim()); say("Password reset email sent. Check your inbox."); }
    if(k==="signout"){ sync.confirmDelete=false; await sync.auth.signOut(); }
    if(k==="deldo"){
      say("Deleting your account…");
      const u = sync.auth.currentUser;
      await communityLeaveAll().catch(()=>{});
      stopSync();
      await sync.db.collection("users").doc(u.uid).delete();
      await u.delete();
      sync.confirmDelete=false; setSync("signedout", "Your account and synced progress were deleted.");
    }
  }catch(e){
    if(e && e.code==="auth/requires-recent-login"){ say("For your security, sign out, sign in again, then delete your account."); if(sync.user) startSync(); }
    else say(authError(e));
  }
}
sheet.addEventListener("submit", ev=>{ if(ev.target.id==="acctForm"){ ev.preventDefault(); accountAction("signin"); } });
sheet.addEventListener("submit", ev=>{
  const f=ev.target.closest("[data-myform]"); if(!f) return; ev.preventDefault();
  const id=f.dataset.myform, u=cleanUrl(f.u.value), err=f.querySelector(".myerr");
  if(!u){ err.textContent="Enter a full web address, for example https://www.youtube.com/watch?v=…"; f.u.focus(); return; }
  const list=getMyRes(id), item={u, t:f.t.value.trim().slice(0,120), k:f.k.value, note:f.note.value.trim().slice(0,200)};
  if(myResEdit && myResEdit.id===id){ list[myResEdit.i]=Object.assign({}, list[myResEdit.i], item); }
  else { if(list.some(r=>r.u===u)){ err.textContent="This link is already in your list."; return; } list.push(Object.assign(item,{at:Date.now()})); }
  setMyRes(id,list); myResEdit=null; myResDel=null; modalTab="res"; openModal(id,true);
  const box=document.getElementById("myu-"+id); if(box) box.focus();
});
sheet.addEventListener("click", ev=>{
  const id=modalId; if(!id) return;
  const e=ev.target.closest("[data-myedit]"), d=ev.target.closest("[data-mydel]"), c=ev.target.closest("[data-mycancel]");
  if(!e && !d && !c) return;
  if(e){ myResEdit={id, i:+e.dataset.myedit}; myResDel=null; }
  else if(c){ myResEdit=null; }
  else { const i=+d.dataset.mydel; if(myResDel===i){ const list=getMyRes(id); list.splice(i,1); setMyRes(id,list); myResDel=null; myResEdit=null; } else myResDel=i; }
  modalTab="res"; openModal(id,true);
  if(e){ const box=document.getElementById("myu-"+id); if(box) box.focus(); }
});
window.addEventListener("online", ()=>{ if(sync.user) queueSync(); });

/* ---------- Boot ---------- */
function start(){
  renderGraph(); renderList(); refreshStages();
  const h = location.hash.slice(1); const first = byId.has(h)? h : null;
  const firstRole = h.startsWith("role-") && ROLES.some(r=>r.id===h.slice(5)) ? h.slice(5) : null;
  let v=null; try{ v = localStorage.getItem("atlas-view"); }catch(e){}
  if(!["home","graph","list","roles","groups"].includes(v)) v = isPhone() ? "home" : "graph";
  const r=svg.node().getBoundingClientRect(); svg.call(zoom.transform, d3.zoomIdentity.translate(r.width/2,r.height/2).scale(.7));
  setView(first||firstRole ? "graph" : v);
  if(first) select(first,{anim:false}); else if(firstRole){ selectRole(firstRole,{anim:false}); }
  else { renderPanel(); applyHighlight(); if(state.view==="graph"){ if(isPhone()) jumpLevel(0,false); else fit(false); } }
  if(isPhone() && state.view!=="graph"){ document.getElementById("map").style.display="block"; jumpLevel(0,false); document.getElementById("map").style.display="none"; }
  initSync();
  if(location.hash==="#delete-account") setTimeout(openDeleteAccount, 1200);
  setTimeout(()=>{ const c=getCommit(); if(c && remindOf(c).on && hasNativeReminders()){ let ok=false; try{ ok=window.AtlasNative.notificationsAllowed(); }catch(e){} if(ok){ pushReminderPlan(); applyReminder(c); } } }, 1500);
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start, start);
