<title>The K.I.S.S model for mastering AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a header band, then a two-pane workspace: the left-to-right level map (or curriculum list) and a study panel. */
:root{
  --r-i:#2563EB; --r-k:#7C3AED; --r-s:#059669; --r-x:#C2410C; --on-r:#FFFFFF;
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EDF4; --fg:#172033; --muted:#566278;
  --line:#D3DAE6; --edge:#A9B4C6; --accent:#2F5FD0; --on-c:#FFFFFF; --stripe:#E8ECF3;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --d-math:#2F5FD0; --d-prob:#7A4BD6; --d-opt:#BE2C84; --d-sys:#5D6B80; --d-ml:#2C8540;
  --d-dl:#D2620C; --d-nlp:#08848F; --d-cv:#C53434; --d-gen:#A57E06; --d-rl:#7D5636;
  --d-llm:#DD3F74; --d-agent:#4F7A0E; --d-safe:#3B47A6; --d-app:#86198F;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --r-i:#7EA6FF; --r-k:#B794FF; --r-s:#4ADE9B; --r-x:#FBAF5D; --on-r:#0E1320;
  --bg:#0E1320; --surface:#161E30; --surface-2:#1D2740; --fg:#E5E9F2; --muted:#98A3B8;
  --line:#2B3754; --edge:#3D4A68; --accent:#86A7FF; --on-c:#0E1320; --stripe:#131A2B;
  --d-math:#86A7FF; --d-prob:#B596FF; --d-opt:#F27DC2; --d-sys:#A3B0C4; --d-ml:#6CCB7E;
  --d-dl:#FF9F55; --d-nlp:#4FD0DA; --d-cv:#FF7F7F; --d-gen:#E6C04D; --d-rl:#CFA27C;
  --d-llm:#FF85AE; --d-agent:#A7D45A; --d-safe:#9AA6FF; --d-app:#E879F9; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --r-i:#7EA6FF; --r-k:#B794FF; --r-s:#4ADE9B; --r-x:#FBAF5D; --on-r:#0E1320;
  --bg:#0E1320; --surface:#161E30; --surface-2:#1D2740; --fg:#E5E9F2; --muted:#98A3B8;
  --line:#2B3754; --edge:#3D4A68; --accent:#86A7FF; --on-c:#0E1320; --stripe:#131A2B;
  --d-math:#86A7FF; --d-prob:#B596FF; --d-opt:#F27DC2; --d-sys:#A3B0C4; --d-ml:#6CCB7E;
  --d-dl:#FF9F55; --d-nlp:#4FD0DA; --d-cv:#FF7F7F; --d-gen:#E6C04D; --d-rl:#CFA27C;
  --d-llm:#FF85AE; --d-agent:#A7D45A; --d-safe:#9AA6FF; --d-app:#E879F9; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
header{padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{flex:1 1 320px;min-width:0}
h1{font-family:var(--font-display);font-weight:700;font-size:1.45rem;letter-spacing:-.01em;margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative}
.search input{width:min(280px,78vw);padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.search ul{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;min-width:260px;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(10,20,40,.16);max-height:320px;overflow:auto}
.search li button{display:flex;width:100%;gap:8px;align-items:center;padding:6px 8px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer}
.search li button:hover,.search li button.kb{background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.legend{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.78rem;cursor:pointer;white-space:nowrap}
.legendlbl{flex:none;align-self:center;font-family:var(--font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-right:2px}
.chip[aria-pressed="true"]::after{content:"✕";margin-left:4px;font-size:.7rem;color:var(--muted)}
.domnote{position:absolute;left:12px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:calc(100% - 24px);padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 6px 18px rgba(10,20,40,.12);font-size:.84rem}
.domnote[hidden]{display:none}
.domnote .btn{min-height:34px;padding:0 12px;font-size:.8rem}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}
.pane{position:relative;min-width:0;min-height:0;overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--bg)}
#map:active{cursor:grabbing}
.zoombtns[hidden],.hint[hidden]{display:none}
.zoombtns{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600}
.hscroll{position:absolute;left:12px;right:64px;bottom:10px;height:14px;border-radius:7px;background:color-mix(in srgb,var(--surface-2) 90%,transparent);border:1px solid var(--line);cursor:pointer;touch-action:none;z-index:4}
.hscroll[hidden]{display:none}
.hscroll:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hthumb{position:absolute;top:1px;bottom:1px;left:0;width:30%;min-width:28px;border-radius:6px;background:color-mix(in srgb,var(--fg) 45%,transparent);cursor:grab;touch-action:none}
.hthumb:hover,.hthumb.drag{background:color-mix(in srgb,var(--fg) 65%,transparent)}
.hthumb.drag{cursor:grabbing}
.hint{position:absolute;left:12px;bottom:34px;font-size:.75rem;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
/* SVG */
.colband{fill:var(--stripe)}
.colband.roleband{fill:color-mix(in srgb,var(--accent) 9%,var(--bg))}
.colname.rolename{fill:var(--accent)}
.rnode{cursor:pointer}
.rnode rect.hit{fill:transparent;stroke:none}
.rnode rect.pill{fill:var(--surface);stroke:color-mix(in srgb,var(--accent) 55%,var(--line));stroke-width:1.3}
.rnode text.lbl{font-family:var(--font-body);font-size:11.5px;font-weight:600;fill:var(--fg)}
.rnode:hover rect.pill,.rnode:focus-visible rect.pill{stroke:var(--accent);stroke-width:2}
.rnode:focus{outline:none}
.rnode.cur rect.pill{fill:var(--accent);stroke:var(--accent)}
.rnode.cur text.lbl{fill:var(--on-c)}
.rhdr text.rfam{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.08em;fill:var(--muted)}
.colband.appband{fill:color-mix(in srgb,var(--d-app) 10%,var(--bg))}
.colname.appname{fill:var(--d-app)}
.colnum{font-family:var(--font-mono);font-size:11px;fill:var(--muted);letter-spacing:.08em}
.colname{font-family:var(--font-display);font-weight:700;font-size:17px;fill:var(--fg)}
.edge{fill:none;stroke:var(--edge);stroke-width:1;opacity:.55;transition:opacity .2s}
.edge.on{stroke:var(--c);opacity:.85;stroke-width:1.5}
.edge.hov{stroke:var(--fg);opacity:.95;stroke-width:1.8}
.edge.dim{opacity:.05}
.node{cursor:pointer;transition:opacity .2s}
.node rect.hit{fill:transparent!important;stroke:none!important}
.node rect{fill:var(--surface);stroke:color-mix(in srgb,var(--c) 40%,var(--line));stroke-width:1}
.node circle{fill:var(--c)}
.node text{font-family:var(--font-body);font-size:11.5px;font-weight:500;fill:var(--fg)}
.node text.sl{font-family:var(--font-mono);font-size:8px;font-weight:700;fill:var(--surface);pointer-events:none}
.node.sel text.sl{fill:var(--c)}
.node:hover rect,.node:focus-visible rect{stroke:var(--c);stroke-width:2}
.node:focus{outline:none}
.node.on rect{fill:color-mix(in srgb,var(--c) 18%,var(--surface));stroke:var(--c)}
.node.sel rect{fill:var(--c);stroke:var(--c);stroke-width:2}
.node.sel text.lbl{fill:var(--on-c);font-weight:600}
.node.sel circle{fill:var(--on-c)}
.node.dim{opacity:.16}
/* Curriculum */
#list{height:100%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.lvl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 20px;padding-block:16px;border-bottom:1px solid var(--line)}
.lvl h2{font-family:var(--font-display);font-size:1.05rem;margin:0;line-height:1.2}
.lvl .num{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.lvl p{margin:4px 0 0;color:var(--muted);font-size:.82rem}
.items{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:999px;background:var(--surface);cursor:pointer;font-size:.82rem;transition:opacity .2s}
.item.on{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c)}
.item.sel{background:var(--c);color:var(--on-c);border-color:var(--c)}
.item.sel .dot{background:var(--on-c)}
.item.dim{opacity:.3}
/* Panel */
aside{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding-block:18px 32px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.78rem;color:var(--muted)}
.meta .dchip{display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-weight:500}
.lvtag{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
aside h2{font-family:var(--font-display);font-size:1.5rem;line-height:1.15;margin:8px 0 8px;text-wrap:balance}
aside h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.desc{margin:0;font-size:.95rem;max-width:62ch}
.formula{margin-top:12px;font-family:var(--font-mono);font-size:.85rem;background:var(--surface-2);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links .item{font-size:.8rem}
.none{color:var(--muted);font-size:.85rem;margin:0}
.modes{display:flex;gap:6px;margin-top:16px}
.modes button{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:.82rem;font-weight:500}
.modes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.profile{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}
.profile div{display:flex;flex-direction:column;align-items:center;gap:3px}
.profile .bar{width:100%;height:36px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.profile .bar span{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:4px 4px 0 0}
.profile small{font-family:var(--font-mono);font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.path{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.path .lh{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--surface-2);border-radius:8px;padding:10px}
.stats b{display:block;font-family:var(--font-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted)}
.howto{margin:0;padding-left:18px;font-size:.88rem}
.howto li{margin-bottom:4px}
.foot{margin-top:24px;font-size:.75rem;color:var(--muted)}
/* K.I.S.S */
.rk2{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--fg);color:var(--bg);font-family:var(--font-mono);font-size:.7rem;font-weight:600;flex:none}
.ladder{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.ladhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.ladhead h3{margin:0}
.ladnote{font-size:.75rem;color:var(--muted)}
.rung{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.rung:hover{border-color:var(--c)}
.rung .rl{display:flex;gap:8px;align-items:flex-start}
.rung .rl b{display:block;font-size:.88rem}
.rung .rl small{display:block;font-size:.72rem;color:var(--muted)}
.rung .rt2{font-size:.86rem;line-height:1.45}
.rung .rb{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.rung.reached{background:color-mix(in srgb,var(--c) 10%,var(--surface));border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.rung.current{border-color:var(--c);border-width:2px;padding:9px 11px}
.keytag{font-size:.7rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--c);color:var(--fg)}
.sform{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;background:var(--surface-2);font-size:.72rem;font-weight:600}
.forms{margin-top:6px;font-size:.84rem}
.forms summary{cursor:pointer;color:var(--fg);font-weight:500;padding:4px 0}
.natline{margin:6px 0 8px;color:var(--muted)}
.forms ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.forms li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:7px 10px;border-radius:6px;background:var(--surface-2);opacity:.75}
.forms li.fit{opacity:1;background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.goalsel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;max-width:min(260px,80vw)}
@media (max-width:700px){.forms li{grid-template-columns:1fr;gap:2px}}
.mysucc{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:12px 14px;border:2px dashed var(--c);border-radius:10px;background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.mysucc.filled{border-style:solid;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.mysucc label{display:flex;align-items:center;gap:8px;font-size:.92rem;font-weight:700;color:var(--fg)}

.mssaved{display:none;margin-left:auto;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--c);color:var(--on-c)}
.mysucc.filled .mssaved{display:inline-block}
.mysucc textarea{width:100%;resize:vertical;min-height:56px;padding:9px 11px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:.92rem;line-height:1.45}
.mysucc textarea:focus{outline:2px solid var(--c);outline-offset:0;border-color:var(--c)}
.mshint{font-size:.74rem;color:var(--muted)}
.sform.mine{background:var(--c);color:var(--on-c)}
.ladclear{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:.78rem;text-decoration:underline;cursor:pointer;padding:2px 0}
.r-i{--rc:var(--r-i)}.r-k{--rc:var(--r-k)}.r-s{--rc:var(--r-s)}.r-x{--rc:var(--r-x)}
.rk2.r-i,.rk2.r-k,.rk2.r-s,.rk2.r-x,.stg.r-i,.stg.r-k,.stg.r-s,.stg.r-x{background:var(--rc);color:var(--on-r)}
.kl{color:var(--rc);font-weight:800}
.kiss{letter-spacing:.01em}
.kiss .kl{font-weight:800}
.wseg button.r-i b,.wseg button.r-k b,.wseg button.r-s b,.wseg button.r-x b{color:var(--rc)}
.wseg button[aria-pressed="true"].r-i,.wseg button[aria-pressed="true"].r-k,.wseg button[aria-pressed="true"].r-s,.wseg button[aria-pressed="true"].r-x{background:var(--rc);color:var(--on-r)}
.wseg button[aria-pressed="true"] b{color:var(--on-r)!important}
.stg{font-family:var(--font-mono);font-size:.62rem;font-weight:700;padding:0 5px;border-radius:4px;background:var(--fg);color:var(--bg);margin-left:2px}
.item.sel .stg{background:var(--on-c);color:var(--c)}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:118px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.82rem}
.fl{display:flex;align-items:center;gap:6px}
.ftrack{position:relative;height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fyou{position:absolute;left:0;bottom:0;height:9px;background:var(--accent);min-width:0;border-radius:0 3px 3px 0}
.fn{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.fn small{color:var(--muted);font-weight:400}
.lkiss{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.lkiss div{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.78rem}
.lkiss b{margin-left:6px;font-size:.8rem}
.lkiss p{margin:6px 0 0;color:var(--fg);font-size:.78rem;line-height:1.4}
@media (max-width:1100px){.lkiss{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.rung{grid-template-columns:minmax(0,1fr)}.rung .rt2{grid-column:1/-1;grid-row:2}.lkiss{grid-template-columns:1fr}}
#roles{height:100%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.rolesintro h2{font-family:var(--font-display);font-size:1.3rem;margin:0}
.rolesintro p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.rfam{margin-top:20px}
.rfam h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:600}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.rcard:hover,.rcard.cur{border-color:var(--accent)}
.rcard b{font-family:var(--font-display);font-size:1rem}
.rcard .rd{font-size:.84rem}
.rcard .rm{font-size:.74rem;color:var(--muted)}
.rbar{display:block;height:4px;border-radius:2px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.rbar span{display:block;height:100%;background:var(--accent)}
.succchip{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-weight:500}
.rgroup{margin-bottom:10px}
.rgroup summary{display:flex;justify-content:space-between;cursor:pointer;font-weight:600;font-size:.88rem;padding:6px 0}

function resourcesFor(n){
  const out = [];
  (RES[n.id]||"").split("|").filter(Boolean).forEach(tok=>{
    if(tok.startsWith("ax:")){ const sp=tok.indexOf(" "); const id=tok.slice(3,sp); out.push({t:tok.slice(sp+1), u:`https://arxiv.org/abs/${id}`, type:"paper", src:`arXiv ${id}`}); }
    else if(LIB[tok]){ const [t,u,type,src]=LIB[tok]; out.push({t,u,type,src}); }
    else console.warn("unknown resource", tok, "for", n.id);
  });
  const q = encodeURIComponent(n.label.replace(/\s*\(.*?\)/g,""));
  const search = [
    {t:"Wikipedia", u:`https://en.wikipedia.org/w/index.php?search=${q}`, src:"Encyclopedia"},
    {t:"YouTube lectures", u:`https://www.youtube.com/results?search_query=${q}+${n.lv<=2?"math+lesson":"machine+learning+lecture"}`, src:"Video search"},
  ];
  if(n.lv>=3) search.push({t:"arXiv papers", u:`https://arxiv.org/search/?query=${q}&searchtype=all`, src:"Paper search"});
  if(n.lv>=3) search.push({t:"Google Scholar", u:`https://scholar.google.com/scholar?q=${q}`, src:"Paper search"});
  return {learn: out.filter(r=>r.type!=="paper"), papers: out.filter(r=>r.type==="paper"), search};
}

// The forms of success that come naturally for a topic, from its band, domain and position in the map.
function naturalForms(n){
  if(FORM_OVERRIDE[n.id]) return FORM_OVERRIDE[n.id];
  const d=n.d, lv=n.lv, leaf=!n.kids.length;
  if(d==="safe") return ["influence","paper"];
  if(lv<=2) return d==="sys" ? ["sme","influence"] : ["influence","sme"];
  if(d==="sys") return ["sme","adoption"];
  if(d==="agent") return ["adoption","technique"];
  if(lv<=4) return (d==="rl"||d==="gen") ? ["adoption","paper"] : ["adoption","sme"];
  if(lv===5) return ["paper","technique"];
  if(lv===6) return (d==="llm"||d==="cv"||d==="nlp") ? ["adoption","paper"] : ["paper","technique"];
  return leaf ? ["technique","paper"] : ["paper","adoption"];
}

  const mine = !formKey && getMySucc(n.id).trim();

  return {k, name:FORM[k].name, text: hand ? hand+"." : FORM[k].tpl(n,build,earn), natural:nat, fits:nat.includes(k), hand:!!HAND[n.id]};
}

const RUNG_RANK = {i:0,k:1,s:2,"$":3};
function rolePath(role){
  const t = role.targets.split(/\s+/).map(id=>byId.get(id)).filter(Boolean);
  const need = new Map();
  const put = (n,r)=>{ if(!need.has(n) || RUNG_RANK[r]>RUNG_RANK[need.get(n)]) need.set(n,r); };
  t.forEach(n=>put(n, role.depth));
  t.forEach(n=>n.pre.forEach(p=>put(p, role.depth==="s"?"k":"i")));
  t.forEach(n=>closure(n,"pre").forEach(a=>put(a,"i")));
  return need;
}
function roleGap(need){
  let met=0; const gaps=[];
  need.forEach((r,n)=>{ const have=STAGE_IDX[getStage(n.id)]; if(have>=RUNG_RANK[r]) met++; else gaps.push(n); });
  return {met, gaps};
}

  if(g.kind==="role"){ const r=ROLES.find(x=>x.id===g.id); if(!r) return null;
    return {key:"role:"+r.id, kind:"role", id:r.id, name:r.name, short:shortRole(r), phases:PHASES[r.id]||[], opt:optSet(r)}; }
  const n=byId.get(g.id); if(!n) return null;
  const set=new Set(); let f=[n];
  for(let i=0;i<3;i++){ const nf=[]; f.forEach(x=>x.pre.forEach(p=>{ if(!set.has(p)){ set.add(p); nf.push(p); } })); f=nf; }
  const [build,earn]=(KISS[n.id]||"|").split("|");
  const bands=[["Foundations", l=>l<=2, `Explain how this maths and code shows up in ${n.label}`, `Work through the maths and code behind one ${n.label} example`],

  bands.forEach(([name,fn,tb,cap])=>{ const ids=[...set].filter(x=>fn(x.lv)).sort((a,b)=>a.lv-b.lv||a.nAnc-b.nAnc).map(x=>x.id); if(ids.length) phases.push([name, ids.join(" "), tb, cap, ""]); });

function ttPlan(path, set, known){
  set = set || ttSettingsFor(path); known = known || knownNow(path);
  const rows=[]; let cum=0; const wk = h => Math.floor(h/set.hpw)+1;
  path.phases.forEach((ph,pi)=>{
    rows.push({phase:true, i:pi+1, name:ph[0]});
    ph[1].split(/\s+/).forEach(id=>{
      const n=byId.get(id), isOpt=path.opt.has(id); if(!n || (isOpt && !set.opt)) return;
      const isKnown=known.has(id), h=isKnown ? 0 : TT_HOURS[n.lv], w0=wk(cum); cum+=h;
      rows.push({n, opt:isOpt, known:isKnown, learned:!isKnown && isLearned(id), h, w0, w1:wk(Math.max(cum-0.01,0)), end:cum, stage:getStage(id)});
    });
    const w0=wk(cum); cum+=TT_CAPSTONE; rows.push({cap:true, text:ph[3], h:TT_CAPSTONE, w0, w1:wk(cum-0.01), end:cum});
  });
  const start=new Date((set.start||ttToday())+"T00:00:00"), weeks=Math.max(1,Math.ceil(cum/set.hpw)), end=new Date(start.getTime()+weeks*7*864e5);
  return {rows, hours:Math.round(cum), weeks, end, start, set, topics:rows.filter(r=>r.n).length, todo:rows.filter(r=>r.n && !r.known).length};
}

/* ---------- Progress against the committed goal ---------- */
function goalProgress(){
  const c=getCommit(); if(!c) return null;
  const path=goalPath(c.goal), plan=goalPlan(path), todo=plan.rows.filter(r=>r.n && !r.known), done=todo.filter(r=>isLearned(r.n.id));
  const days=(Date.now()-plan.start.getTime())/864e5, planned=Math.max(0, days/7*c.hpw);
  const expected=todo.filter(r=>r.end<=planned+0.01).length, diff=done.length-expected;
  const week = days<0 ? 0 : Math.min(plan.weeks, Math.floor(days/7)+1);
  let status, cls;
  if(todo.length && done.length===todo.length){ status="Goal complete"; cls="ok"; }
  else if(days<0){ status=`Starts ${fmtDate(plan.start)}`; cls="wait"; }
  else if(diff>0){ status=`${diff} topic${diff>1?"s":""} ahead`; cls="ok"; }
  else if(diff===0){ status="On track"; cls="ok"; }
  else { status=`${-diff} topic${diff<-1?"s":""} behind`; cls="behind"; }
  return {c, path, plan, todo:todo.length, done:done.length, expected, week, status, cls, next:todo.find(r=>!isLearned(r.n.id))};
}

/* ---------- Weekly reminders for the committed goal ----------
   Android: a native weekly notification (day and time chosen here). The page sends the fixed plan
   so the reminder can say "on track / N behind / N ahead" when it fires. Website: a weekly study
   event to add to the learner's own calendar (.ics). Settings live in the commitment (c.remind). */
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const hasNativeReminders = () => !!(window.AtlasNative && window.AtlasNative.setReminder);
function remindOf(c){ return Object.assign({on:false, day:1, time:"09:00"}, c.remind||{}); }
function pushReminderPlan(){
  if(!hasNativeReminders()) return;
  const g=goalProgress(); if(!g) return;
  const items=g.plan.rows.filter(r=>r.n && !r.known).map(r=>({label:r.n.label, end:Math.round(r.end*100)/100, hours:r.h, learned:isLearned(r.n.id)}));
  try{ window.AtlasNative.reminderPlan(JSON.stringify({goal:g.path.name, start:g.c.start, hpw:g.c.hpw, items})); }catch(e){}
}
function applyReminder(c){
  if(!hasNativeReminders()) return; const r=remindOf(c), [h,m]=r.time.split(":").map(Number);
  try{ window.AtlasNative.setReminder(!!r.on, r.day, h||9, m||0); }catch(e){}
}
let reminderMsg = "";
window.atlasReminderResult = ok => {
  const c=getCommit(); if(!c) return;
  if(!ok && remindOf(c).on){ c.remind=Object.assign(remindOf(c),{on:false}); setCommit(c);
    reminderMsg="Notifications are blocked for this app. Allow them in Android Settings › Apps › K.I.S.S AI › Notifications, then turn the reminder on again."; }
  else if(ok) reminderMsg = remindOf(c).on ? `Reminder set for ${DAYS[remindOf(c).day-1]}s at ${remindOf(c).time}.` : "Reminder turned off.";
  rerenderAll();
};

// A weekly calendar event (.ics) for the website, from the start date to the planned finish.
function reminderICS(g){
  const r=remindOf(g.c), [h,m]=r.time.split(":").map(Number), pad=n=>String(n).padStart(2,"0");
  const d=new Date(g.plan.start); while(((d.getDay()+6)%7)+1!==r.day) d.setDate(d.getDate()+1);
  const dt=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(h||9)}${pad(m||0)}00`;
  const now=new Date(), stamp=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const icsText=t=>t.replace(/[\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//KISS AI//Study plan//EN","BEGIN:VEVENT",
    `UID:kiss-goal-${g.path.key.replace(/[^a-z0-9]/gi,"-")}-${Date.now()}@kiss-ai`, `DTSTAMP:${stamp}`, `DTSTART:${dt}`, "DURATION:PT1H",
    `RRULE:FREQ=WEEKLY;COUNT=${g.plan.weeks}`, `SUMMARY:${icsText("Study: "+g.path.name)}`,
    `DESCRIPTION:${icsText(`K.I.S.S plan: ${g.c.hpw} hours this week. Check your progress and next topic at https://sreekumartp.github.io/kiss-ai/`)}`,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
}

  if(ev.target.closest("[data-remics]")){ const g=goalProgress(); if(!g) return;
    const url=URL.createObjectURL(new Blob([reminderICS(g)],{type:"text/calendar"})), a=document.createElement("a");

function getBg(){ try{ const v=localStorage.getItem("atlas-bg")||"new"; return BACKGROUNDS.some(b=>b.id===v) ? v : "new"; }catch(e){ return "new"; } }
function setBg(v){ try{ localStorage.setItem("atlas-bg",v); }catch(e){} }
// A phase counts as covered when every essential topic is in your background or you have marked it at Knowledge or above.
// Optional topics never block progress. A phase with only optional topics is marked "opt" and is never the starting phase.
function phaseStatus(role){
  const bg=bgSet(currentBg()), opt=optSet(role);
  let started=false;
  return (PHASES[role.id]||[]).map(ph=>{
    const ids=ph[1].split(/\s+/); const known=new Set(ids.filter(id=>bg.has(id)||STAGE_IDX[getStage(id)]>=1));
    const ess=ids.filter(id=>!opt.has(id)), optional=ids.filter(id=>opt.has(id));
    const essNew=ess.filter(id=>!known.has(id)), optNew=optional.filter(id=>!known.has(id));
    let st;
    if(!ess.length) st = "opt";
    else if(!essNew.length && !started) st = "done";
    else if(!started){ started=true; st="now"; }
    else st = "next";
    return {ph, ids, st, known, ess, optional, essNew, optNew};
  });
}

/* ---------- Job market signals ---------- */
// How often each topic came up in the job postings we read for a role: the highest count among
// the asked-for skills that map to it.
const REGION_NAME = {US:"US", EU:"Europe and UK", IN:"India"};
function jobTopicCounts(roleId){
  const j=JOBS[roleId], m=new Map(); if(!j) return m;
  j.skills.forEach(x=>x.t.forEach(t=>m.set(t, Math.max(m.get(t)||0, x.c))));
  return m;
}
function jobRolesFor(topicId){
  return ROLES.map(r=>{ const j=JOBS[r.id]; if(!j) return null; const c=jobTopicCounts(r.id).get(topicId); return c ? {r, c, n:j.n} : null; })
    .filter(Boolean).sort((a,b)=>b.c/b.n-a.c/a.n || b.c-a.c);
}
function jobsTopicHTML(n){
  const list=jobRolesFor(n.id); if(!list.length) return "";
  return `<div class="jobline"><span class="jl">Asked for in job posts</span>${list.slice(0,6).map(x=>`<button class="jrole" data-jrole="${x.r.id}" title="Show this role">${esc(shortRole(x.r))} <b>${x.c} of ${x.n}</b></button>`).join("")}${list.length>6?`<span class="jmore">+${list.length-6} more roles</span>`:""}</div>`;
}
function jobsCardLine(r){
  const j=JOBS[r.id]; if(!j || !j.skills.length) return "";
  return `<span class="rm rjob">In job posts: ${j.skills.slice(0,3).map(x=>esc(x.s.replace(/ \(.*$/,""))).join(" · ")}</span>`;
}
function jobsRoleHTML(role){
  const j=JOBS[role.id];
  if(!j) return `<h3>In job posts</h3><p class="none">We haven't read job postings for this role yet.</p>`;
  const regs=Object.entries(j.reg).filter(([k,v])=>v).map(([k,v])=>`${REGION_NAME[k]} ${v}`).join(" · ");
  const skill = x => { const tops=x.t.map(id=>byId.get(id)).filter(Boolean), have=tops.length && tops.every(t=>isLearned(t.id));
    return `<li class="jskill${have?" have":""}"><div class="jsh"><span class="jsn">${esc(x.s)}${have?` <span class="jhave">✓ you have it</span>`:""}</span><span class="jsc">${x.c} of ${j.n}</span></div>
      <span class="jbar"><span style="width:${Math.round(x.c/j.n*100)}%"></span></span>
      ${tops.length?`<div class="links">${tops.map(itemHTML).join("")}</div>`:`<p class="none">Not a topic on the map.</p>`}</li>`; };
  const top=j.skills.slice(0,6), rest=j.skills.slice(6);
  const mapped=j.skills.filter(x=>x.t.some(id=>byId.has(id))), have=mapped.filter(x=>x.t.every(id=>!byId.has(id)||isLearned(id)));
  return `<h3>In job posts</h3>
    <p class="desc">${esc(j.summary)}</p>
    <div class="stats"><div><b>${j.n}</b><span>postings read</span></div><div><b>${have.length} of ${mapped.length}</b><span>asked skills you have</span></div></div>
    <p class="none">${esc(regs)} · checked ${esc(JOBS_CHECKED)}. A skill counts as yours when you've marked its topics at Knowledge or above.</p>
    ${j.titles.length?`<h4 class="jh">Job titles used</h4><div class="links">${j.titles.map(t=>`<span class="succchip">${esc(t)}</span>`).join("")}</div>`:""}
    <h4 class="jh">Most asked for</h4>
    <ol class="jskills">${top.map(skill).join("")}</ol>
    ${rest.length?`<details class="rgroup"><summary><span>More asked-for skills</span><b>${rest.length}</b></summary><ol class="jskills">${rest.map(skill).join("")}</ol></details>`:""}
    ${j.notes.length?`<h4 class="jh">By region</h4><ul class="jnotes">${j.notes.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
    ${j.posts.length?`<details class="rgroup"><summary><span>Postings we read</span><b>${j.posts.length}</b></summary><ul class="jposts">${j.posts.map(p=>`<li><a href="${esc(p.u)}" target="_blank" rel="noopener noreferrer">${esc(p.t)} ↗</a><span>${esc(p.c)} · ${esc(p.l)}</span></li>`).join("")}</ul><p class="none">Postings close often, so some links may no longer work. They show what employers asked for in ${esc(JOBS_CHECKED)}.</p></details>`:""}`;
}

/* ---------- Model ---------- */
const nodes = RAW.map(([id,label,d,lv,pre,desc,f]) => ({id,label,d,lv,pre:pre?pre.split(","):[],desc,f,kids:[]}));
const byId = new Map(nodes.map(n=>[n.id,n]));
nodes.forEach(n=>{ n.pre = n.pre.filter(p=>{ if(!byId.has(p)){console.warn("missing",p,"for",n.id);return false} return true}).map(p=>byId.get(p)); n.pre.forEach(p=>p.kids.push(n)); });
const edges = []; nodes.forEach(n=>n.pre.forEach(p=>edges.push({s:p,t:n})));
const dIndex = Object.fromEntries(DOMAINS.map(([k],i)=>[k,i]));
const dName = Object.fromEntries(DOMAINS);
function closure(n, key){ const seen=new Set(); const st=[...n[key]]; while(st.length){const x=st.pop(); if(seen.has(x))continue; seen.add(x); st.push(...x[key]);} return seen; }
nodes.forEach(n=>{ n.nAnc = closure(n,"pre").size; n.nDesc = closure(n,"kids").size; });
document.getElementById("sub").textContent = `${nodes.length} topics and ${edges.length} prerequisite links, from arithmetic to reasoning models and agents. Pick any topic to trace everything it builds on.`;
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- State ---------- */
const state = { sel:null, mode:"pre", dom:null, view:"graph", role:null };

/* ---------- Layout ---------- */
const COLW = 300, ROWH = 26, PH = 19;
const measure = document.createElement("canvas").getContext("2d");
function layout(){
  measure.font = '500 11.5px "Instrument Sans", system-ui, sans-serif';
  nodes.forEach(n=> n.w = Math.ceil(measure.measureText(n.label).width) + 30 + (isNewTopic(n.id) ? 30 : 0));
  nodes.forEach(n=> n.col = n.d==="app" ? LEVELS.length : n.lv);
  const cols = Array.from({length:LEVELS.length+1},(_,i)=>nodes.filter(n=>n.col===i));
  const maxLen = Math.max(...cols.map(c=>c.length));
  const band = n => (dIndex[n.d]/(DOMAINS.length-1) - .5) * maxLen * ROWH * .9;
  const place = c => { const off=(c.length-1)*ROWH/2; c.forEach((n,i)=>n.y=i*ROWH-off); };
  cols.forEach(c=>{ c.sort((a,b)=>dIndex[a.d]-dIndex[b.d]); place(c); });
  const mean = a => a.reduce((s,x)=>s+x.y,0)/a.length;
  for(let it=0; it<10; it++){
    for(let l=1;l<cols.length;l++){ cols[l].forEach(n=>{ const b=n.pre.length?mean(n.pre):n.y; n.t=.62*b+.38*band(n); }); cols[l].sort((a,b)=>a.t-b.t); place(cols[l]); }
    for(let l=cols.length-2;l>=0;l--){ cols[l].forEach(n=>{ const b=n.kids.length?mean(n.kids):n.y; n.t=.55*b+.2*n.y+.25*band(n); }); cols[l].sort((a,b)=>a.t-b.t); place(cols[l]); }
  }
  for(let l=1;l<cols.length;l++){ cols[l].forEach(n=>{ const b=n.pre.length?mean(n.pre):n.y; n.t=.62*b+.38*band(n); }); cols[l].sort((a,b)=>a.t-b.t); place(cols[l]); }
  nodes.forEach(n=> n.x = n.col*COLW);
  return maxLen;
}

/* ---------- Render graph ---------- */
const svg = d3.select("#map");
const root = svg.append("g");
let nodeSel, edgeSel, zoom, maxLen, roleSel = null, roleColG = null, roleCol = {x0:0,x1:0,y0:0,y1:0};
function renderGraph(){
  maxLen = layout();
  const top = -(maxLen-1)*ROWH/2 - 70, H = maxLen*ROWH + 100;
  const gc = root.append("g"); bandEls = [];
  [...LEVELS.map(([name],i)=>[`LEVEL ${i}`,name]), ["APPLIED AI · LEVELS 4–7","Applied AI"]].forEach(([num,name],i)=>{
    const applied = i===LEVELS.length;
    const home = {x:i*COLW-16, y:top-10, w:COLW-18, h:H, tx:i*COLW, numY:top+16, nameY:top+38, op: applied?1:(i%2?0:1)};
    const rect = gc.append("rect").attr("class", applied?"colband appband":"colband").attr("rx",14);
    const tn = gc.append("text").attr("class","colnum").text(num);
    const tm = gc.append("text").attr("class", applied?"colname appname":"colname").text(name);
    bandEls.push({rect, tn, tm, home});
  });
  placeBands();
  edgeSel = root.append("g").selectAll("path").data(edges).join("path").attr("class","edge").attr("d", edgeD);
  nodeSel = root.append("g").selectAll("g").data(nodes).join("g").attr("class","node")
    .attr("transform", n=>`translate(${n.x},${n.y-PH/2})`).attr("style", n=>`--c:var(--d-${n.d})`)
    .attr("tabindex",0).attr("role","button").attr("aria-label", n=>`${n.label}, level ${n.lv}`)
    .on("click",(ev,n)=>{ ev.stopPropagation(); select(n.id,{pop:true}); })
    .on("keydown",(ev,n)=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); select(n.id,{pop:true}); } })
    .on("mouseenter",(ev,n)=>{ edgeSel.classed("hov",e=>e.s===n||e.t===n); d3.select(ev.currentTarget).raise(); })
    .on("mouseleave",()=> edgeSel.classed("hov",false));
  nodeSel.append("rect").attr("class","hit").attr("x",-6).attr("y",-(ROWH-PH)/2).attr("width",n=>n.w+12).attr("height",ROWH);
  nodeSel.append("rect").attr("class","pill").attr("width",n=>n.w).attr("height",PH).attr("rx",PH/2);
  nodeSel.append("circle").attr("cx",10).attr("cy",PH/2).attr("r",3.6);
  nodeSel.append("text").attr("class","lbl").attr("x",19).attr("y",PH/2+4).text(n=>n.label);
  nodeSel.filter(n=>isNewTopic(n.id)).append("text").attr("class","newtag").attr("x",n=>n.w-30).attr("y",PH/2+3.5).text("NEW");
  const jb=nodeSel.append("g").attr("class","jobb").attr("transform",n=>`translate(${n.w-3},-1)`);
  jb.append("circle").attr("r",7); jb.append("text").attr("y",3).attr("text-anchor","middle");
  nodeSel.append("text").attr("class","sl").attr("x",10).attr("y",PH/2+3).attr("text-anchor","middle");
  buildRoleColumn(); placeRoleColumn();
  zoom = d3.zoom().scaleExtent([.2,2.5]).clickDistance(5).on("zoom", e=>{ root.attr("transform", e.transform); updateHScroll(e.transform); });
  svg.call(zoom).on("dblclick.zoom", null);
  svg.on("click", ()=> { const rk=document.getElementById("rolekey"); if(rk.classList.contains("open")){ rk.classList.remove("open"); document.getElementById("rkfold").setAttribute("aria-expanded","false"); return; }
    if(state.sel) select(null); else if(state.role){ state.role=null; select(null); } });
}
function bounds(){ const vn=nodes.filter(n=>!n.hidden), xs=vn.map(n=>n.x), xe=vn.map(n=>n.x+n.w), ys=vn.map(n=>n.y);
  return {x0:Math.min(...xs)-20, x1:Math.max(...xe, roleCol.x1)+20, y0:Math.min(...ys, roleCol.y0+70)-80, y1:Math.max(...ys, roleCol.y1-30)+20}; }
function fit(anim=true){ const r=svg.node().getBoundingClientRect(); const b=bounds(); const k=Math.min(r.width/(b.x1-b.x0), r.height/(b.y1-b.y0))*.96;
  const t=d3.zoomIdentity.translate(r.width/2-k*(b.x0+b.x1)/2, r.height/2-k*(b.y0+b.y1)/2).scale(k);
  (anim?svg.transition().duration(600):svg).call(zoom.transform,t); }
function focusNode(n, anim=true){ const r=svg.node().getBoundingClientRect(); if(!r.width) return; const cur=d3.zoomTransform(svg.node()).k; const k=Math.max(cur,.75);
  const t=d3.zoomIdentity.translate(r.width/2-k*(n.x+n.w/2), r.height/2-k*n.y).scale(k);
  (anim?svg.transition().duration(650):svg).call(zoom.transform,t); }

   Tapping a role opens its learning path (the map focuses on it and the panel shows its phases).

function buildRoleColumn(){
  roleColG = root.append("g").attr("class","rolecol");

  roleColG.append("text").attr("class","colnum").text("LEARNING PATHS");

  const items=[];
  Object.entries(ROLE_FAMILIES).forEach(([f,fn])=>{ items.push({hdr:true, label:fn.toUpperCase()}); ROLES.filter(r=>r.fam===f).forEach(r=>items.push({r, label:shortRole(r)})); });
  measure.font = '600 11.5px "Instrument Sans", system-ui, sans-serif';
  items.forEach(d=>{ d.w = d.hdr ? 0 : Math.ceil(measure.measureText(d.label).width) + 30; });

/* ---------- Role focus ----------
   With a role on the map and Focus on, only the role's topics are drawn (as filtered by
   Essential / Optional / Background), packed tightly and zoomed to fit. Desktop keeps the
   left-to-right levels; phones stack the levels top to bottom and wrap topics into rows.
   Links that ran through hidden topics are drawn straight to the nearest shown topic. */
let focusOn = (()=>{ try{ return localStorage.getItem("atlas-focus")!=="0"; }catch(e){ return true; } })();
let focusPaused = false, focusKey = "off", focusVertical = false, focusScale = 1, redSel = null, bandEls = [];
// Opening a topic outside the path pauses focus until that topic is closed or a role is picked.
function focusActive(){ return focusOn && !focusPaused && !!state.role && state.view==="graph"; }
function edgeD(e){
  const s=e.s, t=e.t;
  if(focusVertical){ const x1=s.x+s.w/2, y1=s.y+PH/2, x2=t.x+t.w/2, y2=t.y-PH/2, dy=Math.max(18,(y2-y1)/2);
    return `M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`; }
  const x1=s.x+s.w, y1=s.y, x2=t.x, y2=t.y;
  if(s.x===t.x){ const k=Math.min(60,20+Math.abs(y2-y1)*.25); return `M${s.x},${y1} C${s.x-k},${y1} ${x2-k},${y2} ${x2},${y2}`; }
  const dx=Math.min(110,(x2-x1)/2); return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
}
function placeBands(pos){
  bandEls.forEach((b,i)=>{ const p = pos ? pos.get(i) : b.home; const show = !!p;
    [b.rect,b.tn,b.tm].forEach(el=>el.style("display", show?null:"none")); if(!show) return;
    b.rect.attr("x",p.x).attr("y",p.y).attr("width",p.w).attr("height",p.h).style("opacity", pos?1:b.home.op);
    b.tn.attr("x",p.tx).attr("y",p.numY); b.tm.attr("x",p.tx).attr("y",p.nameY); });
}
// The topics the role view shows: the role's path, the domain filter, then the tier toggles.
function roleVisible(){
  if(!state.role) return null;
  const r=ROLES.find(x=>x.id===state.role), t=roleTiers(r);
  let s=new Set(rolePath(r).keys()); t.all.forEach(id=>s.add(byId.get(id)));
  if(state.dom) s=new Set([...s].filter(inDom));
  return new Set([...s].filter(n=> t.ess.has(n.id) ? roleFilter.ess : t.opt.has(n.id) ? roleFilter.opt : roleFilter.bg));
}
// Lays the map out for the current focus state. Returns true when positions changed.
function applyFocus(){
  const on = focusActive(), vis = on ? roleVisible() : null, r = svg.node().getBoundingClientRect();
  const key = on ? [state.role, [...vis].map(n=>n.id).sort().join(","), isPhone(), Math.round(r.width/40), Math.round(r.height/40)].join("|") : "off";
  document.body.classList.toggle("focusing", on); document.body.classList.toggle("focusvert", on && isPhone());
  if(key===focusKey) return false;
  focusKey = key;
  nodes.forEach(n=>{ if(n.ox!==undefined){ n.x=n.ox; n.y=n.oy; } n.hidden=false; });
  focusVertical = false;
  let bands = null;
  if(on && vis.size){
    nodes.forEach(n=>{ n.ox=n.x; n.oy=n.y; n.hidden=!vis.has(n); });
    const shown=[...vis], cols=[...new Set(shown.map(n=>n.col))].sort((a,b)=>a-b);
    const own = new Set([...roleTiers(ROLES.find(x=>x.id===state.role)).all]);
    // The role's own topics first in each level, then background topics.
    const inCol = c => shown.filter(n=>n.col===c).sort((a,b)=>(own.has(b.id)-own.has(a.id)) || a.oy-b.oy);
    bands = new Map();
    if(isPhone()){
      focusVertical = true;
      // Largest scale at which the whole path fits the screen; below that the path scrolls.
      const avail = r.height - 150; let K = .6, W = 0;
      for(const k of [.9,.8,.7,.6]){
        K=k; W=(r.width-28)/k; let y=0;
        cols.forEach(c=>{ y+=46; let x=0; inCol(c).forEach(n=>{ if(x+n.w>W && x>0){ x=0; y+=ROWH+6; } x+=n.w+10; }); y+=ROWH+30; });
        if(y*k<=avail) break;
      }
      focusScale = K; let y=0;
      cols.forEach(c=>{ const by=y; y+=46; let x=0;
        inCol(c).forEach(n=>{ if(x+n.w>W && x>0){ x=0; y+=ROWH+6; } n.x=x; n.y=y; x+=n.w+10; });
        bands.set(c,{x:-10, y:by-8, w:W+20, h:(y-by)+PH+16, tx:0, numY:by+8, nameY:by+26}); y+=ROWH+30; });
    } else {
      const GAP = Math.max(COLW*.92, Math.max(...shown.map(n=>n.w))+24);
      cols.forEach((c,ci)=>{ const list=inCol(c); list.forEach((n,i)=>{ n.x=ci*GAP; n.y=(i-(list.length-1)/2)*(ROWH+8); }); });
      const ys=shown.map(n=>n.y), top=Math.min(...ys)-70, H=Math.max(...ys)-Math.min(...ys)+110;
      cols.forEach((c,ci)=>bands.set(c,{x:ci*GAP-16, y:top-10, w:GAP-18, h:H, tx:ci*GAP, numY:top+16, nameY:top+38}));
    }
  }
  nodeSel.attr("transform", n=>`translate(${n.x},${n.y-PH/2})`).style("display", n=>n.hidden?"none":null);
  edgeSel.attr("d", edgeD).style("display", bands ? "none" : null);
  if(redSel){ redSel.remove(); redSel = null; }
  if(bands){
    const shown=new Set(nodes.filter(n=>!n.hidden)), red=[];
    shown.forEach(n=>{ const seen=new Set(), st=[...n.pre];
      while(st.length){ const p=st.pop(); if(seen.has(p)) continue; seen.add(p); if(shown.has(p)) red.push({s:p,t:n}); else st.push(...p.pre); } });
    const order=new Map([...bands.keys()].map((c,i)=>[c,i]));
    const own = new Set([...roleTiers(ROLES.find(x=>x.id===state.role)).all]);
    const list = focusVertical ? red.filter(e=>order.get(e.t.col)-order.get(e.s.col)<=1 && own.has(e.t.id) && own.has(e.s.id)) : red;
    redSel = d3.select(edgeSel.node().parentNode).selectAll("path.redge").data(list).join("path").attr("class","edge redge").attr("d", edgeD);
  }
  placeBands(bands);

}
function fitFocus(anim=true){
  const r=svg.node().getBoundingClientRect(); if(!r.width) return;
  const shown=nodes.filter(n=>!n.hidden); if(!shown.length) return;
  let t;
  if(focusVertical){ t=d3.zoomIdentity.translate(14+10*focusScale, state.dom ? 176 : 132).scale(focusScale); }
  else {
    const availH=r.height-90;
    const box = withRoles => { const x0=Math.min(...shown.map(n=>n.x))-30, x1=Math.max(...shown.map(n=>n.x+n.w), withRoles?roleCol.x1:-1e9)+30,
      y0=Math.min(...shown.map(n=>n.y), withRoles?roleCol.y0+74:1e9)-84, y1=Math.max(...shown.map(n=>n.y), withRoles?roleCol.y1-50:-1e9)+40;
      return {x0,x1,y0,y1,k:Math.max(.3, Math.min(1.1, r.width/(x1-x0), availH/(y1-y0)))}; };
    const a=box(false), b=box(true), {x0,x1,y0,y1,k} = b.k >= a.k*.75 ? b : a;
    t=d3.zoomIdentity.translate(r.width/2-k*(x0+x1)/2, availH/2-k*(y0+y1)/2+10).scale(k);
  }

}

// The Mathematics chip also covers probability & statistics and optimization; other chips are one area each.
const DOMAIN_GROUP = {math:["math","prob","opt"]};
const inDom = n => (DOMAIN_GROUP[state.dom] || [state.dom]).includes(n.d);
const domLabel = d => d==="math" ? "Mathematics (incl. probability & optimization)" : dName[d];
// Explains an active area filter, with counts, and offers a way to clear it.
function updateDomNote(){

    const r=ROLES.find(x=>x.id===state.role), t=roleTiers(r);
    const inArea=[...t.all].filter(id=>inDom(byId.get(id))), e=inArea.filter(id=>t.ess.has(id)).length, o=inArea.length-e;
    const bg=[...rolePath(r).keys()].filter(n=>inDom(n) && !t.all.has(n.id)).length;
    txt = inArea.length || bg
      ? `<b>${esc(area)}</b> in ${esc(shortRole(r))}'s path: ${e} essential · ${o} optional${bg && !roleFilter.bg ? ` · ${bg} background off (tap Background to show)` : ""}`

document.getElementById("domnote").addEventListener("click", ev=>{ if(ev.target.closest("[data-clrdom]")){ state.dom=null; renderPanel(); applyHighlight(); if(focusActive()) fitFocus(); else if(!state.role){ if(isPhone()) jumpLevel(0); else fit(); } } });

/* ---------- Highlight ---------- */
function activeSet(){
  if(state.sel){ const n=byId.get(state.sel); const s=closure(n, state.mode==="pre"?"pre":"kids"); s.add(n); return s; }
  if(state.role){ const r=ROLES.find(x=>x.id===state.role); let s=new Set(rolePath(r).keys()); roleTiers(r).all.forEach(id=>s.add(byId.get(id)));
    if(state.dom) s=new Set([...s].filter(inDom)); return s; }
  if(state.dom){ return new Set(nodes.filter(inDom)); }
  return null;
}
// Role view tiers: essential = path topics you need to get started (plus core targets),
// optional = topics marked optional for the role, background = everything else the role builds on.
function roleTiers(role){
  const opt=optSet(role), all=new Set((PHASES[role.id]||[]).flatMap(ph=>ph[1].split(/\s+/)));
  role.targets.split(/\s+/).forEach(id=>all.add(id));
  const ess=new Set([...all].filter(id=>!opt.has(id)));
  return {all, ess, opt:new Set([...all].filter(id=>opt.has(id)))};
}
// Which role tiers the map shows: essential, optional, background. Remembered per device.
// Background starts hidden so a role opens on just its own path (stored under a new key so the new default applies).
const roleFilter = (()=>{ try{ const v=JSON.parse(localStorage.getItem("atlas-rolefilter2")); if(v && (v.ess||v.opt||v.bg)) return v; }catch(e){} return {ess:true,opt:true,bg:false}; })();
// The role filter is always on the map. Without an active role it offers a role picker,

}
function openRolePicker(){ renderRolePicker(); const el=document.getElementById("rpick"); el.hidden=false; const cur=el.querySelector('[aria-current="true"]')||el.querySelector(".rprow"); if(cur){ cur.scrollIntoView({block:"center"}); cur.focus(); } }

function cleanUrl(s){
  s=(s||"").trim(); if(!s) return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(s)) s="https://"+s;
  try{ const u=new URL(s); if(!/^https?:$/.test(u.protocol) || !u.hostname.includes(".")) return null; return u.href; }catch(e){ return null; }
}
function getMyRes(id){
  try{ const v=JSON.parse(localStorage.getItem("atlas-myres-"+id)||"[]");

   arXiv papers can be saved as PDFs and opened without a connection. The app keeps the files in
   its own storage; the page only asks for each paper's status and shows Save / Saving / Open. */
const hasPapersOffline = () => !!(window.AtlasNative && window.AtlasNative.savePaper);
const arxivOf = r => { const m=/arxiv\.org\/abs\/([0-9]{4}\.[0-9]{4,5}(v[0-9]+)?)/.exec(r.u||""); return m ? m[1] : null; };

let paperPoll = null;
function paperHTML(r){
  const id=arxivOf(r); if(!hasPapersOffline() || !id) return resHTML(r);
  const st=paperStatus(id);
  if(st==="saving" && !paperPoll) paperPoll=setTimeout(()=>{ paperPoll=null; if(!modal.hidden && modalId && modalTab==="res") openModal(modalId, true); }, 2500);
  const act = st==="saved" ? `<span class="psaved">Saved offline</span><button class="btn" data-popen="${id}">Open</button><button class="linkbtn" data-pdel="${id}">Remove</button>`
    : st==="saving" ? `<span class="psaving">Saving…</span>`

}
function papersOfflineHead(papers){

/* ---------- Search ---------- */
const q = document.getElementById("q"), qres = document.getElementById("qres"); let hits=[], kb=0;
// Common abbreviations, so "RL", "reinforcement learning", "LLM" or "computer vision" all find the right topics.
const ABBR = {rl:"reinforcement learning", rlhf:"reinforcement learning from human feedback reward models", rlvr:"reinforcement learning with verifiable rewards",
  rlaif:"reinforcement learning from ai feedback", llm:"large language models", llms:"large language models", nlp:"natural language processing",
  cv:"computer vision", ml:"machine learning", dl:"deep learning", ai:"artificial intelligence", genai:"generative ai", gan:"generative adversarial networks",
  vae:"variational autoencoder", rag:"retrieval augmented generation", mcp:"model context protocol", ppo:"proximal policy optimization",
  dpo:"direct preference optimization", sft:"supervised fine-tuning instruction tuning", lora:"low-rank adaptation fine-tuning", peft:"parameter-efficient fine-tuning",
  cnn:"convolutional neural networks", rnn:"recurrent neural networks", lstm:"long short-term memory", mlp:"multilayer perceptron",
  svm:"support vector machines", pca:"principal component analysis", moe:"mixture of experts", vlm:"vision language models", ssm:"state space models",
  mcts:"monte carlo tree search", mdp:"markov decision process", dqn:"deep q-networks", td:"temporal difference", kv:"key value cache",
  gpu:"graphics processing unit cuda", tpu:"tensor processing unit", asr:"automatic speech recognition", tts:"text to speech", ocr:"optical character recognition",
  vit:"vision transformer", clip:"contrastive language image pretraining", gnn:"graph neural networks", nerf:"neural radiance fields", slam:"localization and mapping",
  mlops:"machine learning operations deployment", llmops:"llm operations observability", xai:"explainable ai interpretability", sae:"sparse autoencoders",
  mle:"maximum likelihood estimation", map:"maximum a posteriori", kl:"kullback-leibler divergence", sgd:"stochastic gradient descent", eda:"exploratory data analysis"};
// Everyday names for each domain, so searches like "computer vision" or "reinforcement learning" find the whole area.
const DOMAIN_ALIAS = {math:"mathematics maths", prob:"probability statistics stats", opt:"optimization optimisation", sys:"computing systems engineering",
  ml:"machine learning ml classical", dl:"deep learning dl neural networks", nlp:"natural language processing nlp text speech", cv:"computer vision cv images",
  gen:"generative ai genai generative models", rl:"reinforcement learning rl", llm:"large language models llm llms foundation models",
  agent:"ai agents agentic", safe:"ai safety alignment interpretability", app:"applied ai applications"};
const searchText = new Map();
function topicSearchText(n){
  if(searchText.has(n.id)) return searchText.get(n.id);
  const words=(n.label+" "+n.id).toLowerCase().match(/[a-z0-9]+/g)||[];
  const t=(n.label+" "+words.map(w=>ABBR[w]||"").join(" ")+" "+dName[n.d]+" "+(DOMAIN_ALIAS[n.d]||"")).toLowerCase();
  searchText.set(n.id,t); return t;
}
function runSearch(){
  let s = q.value.trim().toLowerCase(); if(!s){ qres.hidden=true; return; }
  const exp = ABBR[s.replace(/[^a-z0-9]/g,"")];
  // Match from the start of a word, so "rl" doesn't match "Monte Carlo" and "llm" doesn't match "Bellman".
  const re = x => new RegExp("(^|[^a-z0-9])" + x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const rs = re(s), rx = exp ? re(exp) : null;
  hits = nodes.map(n=>{ const l=n.label.toLowerCase(), t=topicSearchText(n), d=n.desc.toLowerCase();
      const sc = l.startsWith(s)?0 : rs.test(l)?1 : (rs.test(t)||(rx && rx.test(t)))?1.5 : (rs.test(d)||(rx && rx.test(d)))?2 : 9; return [sc,n]; })
    .filter(([sc])=>sc<9).sort((a,b)=>a[0]-b[0]||a[1].lv-b[1].lv).slice(0,12).map(x=>x[1]);
  kb=0;
  qres.innerHTML = hits.length? hits.map((n,i)=>`<li><button data-id="${n.id}" class="${i===kb?"kb":""}" style="--c:var(--d-${n.d})"><span class="dot"></span><span>${esc(n.label)}${newBadge(n.id)}</span><small style="margin-left:auto;color:var(--muted)">L${n.lv}</small></button></li>`).join("")
    : `<li style="padding:8px;color:var(--muted)">No topic matches “${esc(q.value)}”.</li>`;
  qres.hidden=false;
}
q.addEventListener("input", runSearch);
q.addEventListener("keydown", ev=>{
  if(qres.hidden||!hits.length) return;
  if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ ev.preventDefault(); kb=(kb+(ev.key==="ArrowDown"?1:-1)+hits.length)%hits.length; qres.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("kb",i===kb)); }
  if(ev.key==="Enter"){ ev.preventDefault(); pick(hits[kb].id); }
  if(ev.key==="Escape"){ qres.hidden=true; }
});

/* ---------- Phone map: readable zoom, level jumps, info bar ---------- */
const PHONE_K = .9;
function jumpLevel(i, anim=true){
  const r=svg.node().getBoundingClientRect(); const cur=d3.zoomTransform(svg.node());
  const k=Math.max(cur.k, isPhone()?PHONE_K:.6);
  const col=nodes.filter(n=>n.col===i); const cy = col.length ? (Math.min(...col.map(n=>n.y))+Math.max(...col.map(n=>n.y)))/2 : (roleCol.y0+roleCol.y1)/2 - 40;
  // The Roles column opens at its top, just under the level bar.
  const ty = col.length ? r.height/2 + 20 - k*cy : 64 - k*roleCol.y0;
  const t=d3.zoomIdentity.translate(14 - k*(i*COLW-16), ty).scale(k);
  (anim?svg.transition().duration(500):svg).call(zoom.transform,t);
}

/* ---------- Roles UI ---------- */
function fitNodes(list, anim=true){
  if(!list.length) return; const r=svg.node().getBoundingClientRect(); if(!r.width) return;
  const x0=Math.min(...list.map(n=>n.x))-30, x1=Math.max(...list.map(n=>n.x+n.w))+30, y0=Math.min(...list.map(n=>n.y))-80, y1=Math.max(...list.map(n=>n.y))+30;
  let k=Math.max(.2, Math.min(1.1, Math.min(r.width/(x1-x0), r.height/(y1-y0))*.95));
  if(isPhone()){ k=Math.max(k,.75); const tg=state.role ? ROLES.find(x=>x.id===state.role).targets.split(/\s+/).map(id=>byId.get(id)) : list;
    const cx=(Math.min(...tg.map(n=>n.x))+Math.max(...tg.map(n=>n.x+n.w)))/2, cy=(Math.min(...tg.map(n=>n.y))+Math.max(...tg.map(n=>n.y)))/2;
    const t=d3.zoomIdentity.translate(r.width/2-k*cx, r.height/2-k*cy).scale(k); (anim?svg.transition().duration(650):svg).call(zoom.transform,t); return; }
  const t=d3.zoomIdentity.translate(r.width/2-k*(x0+x1)/2, r.height/2-k*(y0+y1)/2).scale(k);
  (anim?svg.transition().duration(650):svg).call(zoom.transform,t);
}
function selectRole(id, opts={}){
  state.role=id; state.sel=null; state.dom=null; focusPaused=false;
  if(id){ try{ localStorage.setItem("atlas-lastrole", id); }catch(e){} }
  if(!modal.hidden) closeModal();
  renderPanel(); applyHighlight();
  if(id && state.view==="graph"){ if(focusActive()) fitFocus(opts.anim!==false); else fitNodes([...rolePath(ROLES.find(x=>x.id===id)).keys()], opts.anim!==false); }
  if(id && location.hash.slice(1)!=="role-"+id){ try{ history.replaceState(null,"","#role-"+id); }catch(e){ location.hash="role-"+id; } }
}
const RUNG_LABEL = {s:"Build it (Skill)", k:"Teach it (Knowledge)", i:"Be aware of it (Information)"};
function roleHTML(role){
  const need=rolePath(role), {met,gaps}=roleGap(need);
  const by = rr => [...need].filter(([n,x])=>x===rr).map(([n])=>n).sort((a,b)=>a.lv-b.lv||dIndex[a.d]-dIndex[b.d]);
  const S=by("s"), K=by("k"), I=by("i");
  const deep = gaps.filter(n=>need.get(n)!=="i"), shallow = gaps.filter(n=>need.get(n)==="i");
  const next = (deep.length?deep:shallow).sort((a,b)=>a.lv-b.lv||b.nDesc-a.nDesc).slice(0,6);
  const pct = Math.round(met/need.size*100);

/* ---------- Study groups ----------
   Anyone signed in can create a group around a goal, discover groups and ask to join; the group's
   creator approves requests and can remove posts or members. Inside a group, members ask and answer
   questions, post progress updates, and share their goal, progress and full topic ladder.
   Data lives in Firestore under groups/{gid} (see firestore.rules for who can read and write what).
   "atlas-mygroups" (synced) remembers which groups this learner belongs to or has asked to join. */
const comm = { gid:null, tab:"questions", groups:null, loading:false, unsub:[], group:null, members:[], posts:[], requests:[],
  open:{}, answers:{}, msg:"", creating:false, filter:"all", confirm:null, reportFor:null, pubTimer:null };
const myName = () => { try{ return (localStorage.getItem("atlas-displayname")||"").trim(); }catch(e){ return ""; } };
function myGroups(){ try{ const v=JSON.parse(localStorage.getItem("atlas-mygroups")||"[]"); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function setMyGroups(list){ try{ localStorage.setItem("atlas-mygroups", JSON.stringify(list)); }catch(e){} }
function blockedSet(){ try{ return new Set(JSON.parse(localStorage.getItem("kiss-blocked")||"[]")); }catch(e){ return new Set(); } }
function blockUser(uid){ const b=blockedSet(); b.add(uid); try{ localStorage.setItem("kiss-blocked", JSON.stringify([...b])); }catch(e){} }
const FV = () => firebase.firestore.FieldValue;
const gref = gid => sync.db.collection("groups").doc(gid);
const meUid = () => sync.user && sync.user.uid;
function commErr(e){
  const c=(e && e.code)||"";
  if(c.includes("permission-denied")) return "You don't have access to that. If Groups never work, the Firestore rules may not be published yet.";
  if(c.includes("unavailable")) return "No connection. Check your internet and try again.";
  return (e && e.message) || "Something went wrong. Try again.";
}
function ago(ts){
  const d = ts && ts.toDate ? ts.toDate() : null; if(!d) return "just now";
  const m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1) return "just now"; if(m<60) return m+" min ago"; const h=Math.round(m/60); if(h<24) return h+" h ago";
  const dd=Math.round(h/24); return dd<14 ? dd+" d ago" : d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
function commUnsubscribe(){ comm.unsub.forEach(f=>{ try{ f(); }catch(e){} }); comm.unsub=[]; }

// What a member shares with their groups: name, goal, progress and the full topic ladder.
function myShare(){
  const g=goalProgress(), ladder={};
  nodes.forEach(n=>{ const st=getStage(n.id); if(st) ladder[n.id]=st; });
  return { name:myName(), goal:g ? g.path.key : null, goalName:g ? g.path.name : null,
    pct:g && g.todo ? Math.round(g.done/g.todo*100) : 0, status:g ? g.status : null, done:g ? g.done : 0, todo:g ? g.todo : 0,
    ladder, updatedAt:FV().serverTimestamp() };
}
async function publishProgress(gid){ if(!sync.db || !sync.user || !myName()) return; await gref(gid).collection("members").doc(meUid()).update(myShare()); }
function queueCommunity(){
  clearTimeout(comm.pubTimer);
  comm.pubTimer=setTimeout(()=>{ if(!sync.db || !sync.user) return; myGroups().filter(g=>g.status==="member").forEach(g=>publishProgress(g.gid).catch(()=>{})); }, 4000);
}

// Check which groups this learner belongs to (approved, still pending, declined or removed).
async function refreshMembership(){
  const list=myGroups(), out=[];
  for(const g of list){
    let member=false;
    try{ member=(await gref(g.gid).collection("members").doc(meUid()).get()).exists; }catch(e){ member=false; }
    if(member){ out.push({gid:g.gid, status:"member"}); continue; }
    if(g.status==="pending"){ let pending=false; try{ pending=(await gref(g.gid).collection("requests").doc(meUid()).get()).exists; }catch(e){}
      if(pending) out.push(g); }
  }
  setMyGroups(out);
}
async function loadGroups(){
  const token = comm.loadToken = (comm.loadToken||0) + 1;   // a newer load wins over an older one
  comm.loading=true; renderGroups();
  try{
    const snap=await sync.db.collection("groups").orderBy("createdAt","desc").limit(60).get();
    const list=snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    await refreshMembership();
    const known=new Set(list.map(g=>g.id));
    for(const g of myGroups()) if(!known.has(g.gid)){ try{ const d=await gref(g.gid).get(); if(d.exists){ list.push(Object.assign({id:d.id}, d.data())); known.add(d.id); } }catch(e){} }
    if(token!==comm.loadToken) return;
    comm.groups=list;
  }catch(e){ if(token===comm.loadToken) comm.msg=commErr(e); }
  if(token===comm.loadToken){ comm.loading=false; renderGroups(); }
}
function openGroupsView(){
  commUnsubscribe();
  if(comm.gid && sync.user){ openGroup(comm.gid); return; }
  renderGroups();
  if(sync.db && sync.user && myName()) loadGroups();
}

function groupsListHTML(){
  const head=`<div class="ghead"><h2>Study groups</h2><p class="none">Learn with people working towards the same goal: ask questions, share progress and keep each other going.</p></div>`;

  const memberIds=new Set(mine.filter(x=>x.status==="member").map(x=>x.gid)), pendingIds=new Set(mine.filter(x=>x.status==="pending").map(x=>x.gid));
  const myCards=[...memberIds].map(id=>byId2.get(id)).filter(Boolean).map(g=>card(g, `<button class="btn primary" data-gopen="${g.id}">Open</button>`)).join("");
  const pendCards=[...pendingIds].map(id=>byId2.get(id)).filter(Boolean).map(g=>card(g, `<span class="gpend">Request sent</span><button class="linkbtn" data-gcancel="${g.id}">Cancel request</button>`)).join("");
  let disc=(comm.groups||[]).filter(g=>!memberIds.has(g.id) && !pendingIds.has(g.id));
  if(comm.filter==="goal" && c) disc=disc.filter(g=>g.goal===c.goal);
  const discCards=disc.map(g=>card(g, comm.reqFor===g.id
    ? `<form class="gform greq" data-greq="${g.id}"><label class="sr" for="gMsg">Message</label><input id="gMsg" name="m" maxlength="200" placeholder="Say hello (optional)"><button class="btn primary" type="submit">Send request</button><button class="btn" type="button" data-greqx>Cancel</button></form>`
    : `<button class="btn" data-greqopen="${g.id}">Ask to join</button>`)).join("");
  const goals = [...(c ? [goalPath(c.goal)] : []), ...ROLES.map(r=>goalPath("role:"+r.id)), ...nodes.filter(n=>n.d==="app").map(n=>goalPath("topic:"+n.id))].filter(Boolean);
  const seen=new Set(), goalOpts=goals.filter(g=>!seen.has(g.key) && seen.add(g.key)).map(g=>`<option value="${g.key}">${esc(g.name)}</option>`).join("");
  return head + (comm.msg?`<p class="gmsg" role="status">${esc(comm.msg)}</p>`:"")
    + `<section class="gsec"><h3>My groups</h3>${myCards||pendCards ? `<div class="gcards">${myCards}${pendCards}</div>` : `<p class="none">You haven't joined a group yet. Create one, or ask to join one below.</p>`}</section>
    <section class="gsec"><h3>Start a group</h3>${comm.creating ? `<form class="gform" data-gcreate>
      <label class="ttl" for="gcName">Group name</label><input id="gcName" name="n" maxlength="60" required placeholder="e.g. Weekend RAG builders">
      <label class="ttl" for="gcGoal">Goal</label><select id="gcGoal" name="g">${goalOpts}</select>
      <label class="ttl" for="gcDesc">About the group (optional)</label><textarea id="gcDesc" name="d" maxlength="300" rows="3" placeholder="When you meet, what you're working on, who should join"></textarea>
      <div class="btnrow"><button class="btn primary" type="submit">Create group</button><button class="btn" type="button" data-gcreatex>Cancel</button></div><p class="myerr" role="alert"></p></form>`
      : `<div class="btnrow" style="margin-top:0"><button class="btn primary" data-gcreateopen>Start a group</button></div>`}</section>
    <section class="gsec"><div class="gsechead"><h3>Discover groups</h3>${c?`<div class="ctabs gfilt" role="tablist"><button role="tab" aria-selected="${comm.filter==="all"}" data-gfilter="all">All</button><button role="tab" aria-selected="${comm.filter==="goal"}" data-gfilter="goal">Same goal as me</button></div>`:""}</div>
      ${comm.loading && !comm.groups ? `<p class="none">Loading groups…</p>` : discCards ? `<div class="gcards">${discCards}</div>` : `<p class="none">No ${comm.filter==="goal"?"matching ":""}groups yet. Start the first one.</p>`}</section>
    <p class="note gguide">Be kind and stay on topic. Don't share personal contact details. Use Report on anything harmful; the group creator can remove posts and members. You must be 13 or older.</p>`;
}

function openGroup(gid){
  commUnsubscribe(); comm.reqSub=false; comm.gid=gid; comm.members=[]; comm.posts=[]; comm.requests=[]; comm.group=null; comm.msg=""; comm.confirm=null; comm.reportFor=null;
  renderGroups();
  const g=gref(gid), onErr=e=>{ comm.msg=commErr(e); renderGroups(); };
  comm.unsub.push(g.onSnapshot(d=>{ if(!d.exists){ comm.msg="This group was deleted."; setMyGroups(myGroups().filter(x=>x.gid!==gid)); closeGroup(); return; }
    comm.group=Object.assign({id:d.id}, d.data());
    if(comm.group.ownerUid===meUid() && !comm.reqSub){ comm.reqSub=true; comm.unsub.push(g.collection("requests").orderBy("at").onSnapshot(s=>{ comm.requests=s.docs.map(x=>Object.assign({uid:x.id}, x.data())); renderGroups(); }, ()=>{})); }
    renderGroups(); }, onErr));
  comm.unsub.push(g.collection("members").onSnapshot(s=>{ comm.members=s.docs.map(x=>Object.assign({uid:x.id}, x.data())); renderGroups(); }, e=>{ if(e.code==="permission-denied"){ comm.msg = myGroups().some(x=>x.gid===gid && x.status==="member") ? "You're no longer a member of this group." : "Only members can see inside this group. Ask to join from Discover groups."; setMyGroups(myGroups().filter(x=>x.gid!==gid)); closeGroup(); } else onErr(e); }));
  comm.unsub.push(g.collection("posts").orderBy("at","desc").limit(100).onSnapshot(s=>{ comm.posts=s.docs.map(x=>Object.assign({id:x.id}, x.data())); renderGroups(); }, ()=>{}));
  publishProgress(gid).catch(()=>{});
}

/* ----- Actions ----- */
async function commDo(fn, okMsg){ try{ await fn(); if(okMsg!==undefined) comm.msg=okMsg; }catch(e){ comm.msg=commErr(e); } renderGroups(); }
async function loadAnswers(pid){
  const s=await gref(comm.gid).collection("posts").doc(pid).collection("answers").orderBy("at").limit(100).get();
  comm.answers[pid]=s.docs.map(d=>Object.assign({id:d.id}, d.data())); renderGroups();
}
async function deleteGroupAll(gid){
  const g=gref(gid);
  for(const sub of ["requests","members"]){ const s=await g.collection(sub).get(); for(const d of s.docs) if(sub!=="members" || d.id!==meUid()) await d.ref.delete(); }
  const posts=await g.collection("posts").get();
  for(const p of posts.docs){ const a=await p.ref.collection("answers").get(); for(const d of a.docs) await d.ref.delete(); await p.ref.delete(); }
  await g.collection("members").doc(meUid()).delete().catch(()=>{});
  await g.delete();
}
async function leaveGroup(gid){
  const b=sync.db.batch(); b.delete(gref(gid).collection("members").doc(meUid())); b.update(gref(gid), {memberCount:FV().increment(-1)}); await b.commit();
}
// When an account is deleted: delete groups it created, and leave the others after removing its posts.
async function communityLeaveAll(){
  if(!sync.db || !sync.user) return;
  for(const m of myGroups()){
    try{
      const g=(await gref(m.gid).get()).data()||{};
      if(g.ownerUid===meUid()){ await deleteGroupAll(m.gid); continue; }
      if(m.status==="pending"){ await gref(m.gid).collection("requests").doc(meUid()).delete(); continue; }
      const mine=await gref(m.gid).collection("posts").where("uid","==",meUid()).get();
      for(const p of mine.docs){ const a=await p.ref.collection("answers").get(); for(const d of a.docs) await d.ref.delete().catch(()=>{}); await p.ref.delete(); }
      await leaveGroup(m.gid);
    }catch(e){}
  }
  setMyGroups([]);
}

  const t=ev.target.closest("button"); if(!t) return;
  const d=t.dataset, me=meUid();

  if("gopen" in d){ comm.tab="questions"; openGroup(d.gopen); return; }
  if("gback" in d){ closeGroup(); return; }
  if("gtab" in d){ comm.tab=d.gtab; comm.confirm=null; comm.reportFor=null; renderGroups(); return; }
  if("gfilter" in d){ comm.filter=d.gfilter; renderGroups(); return; }
  if("gcreateopen" in d){ comm.creating=true; renderGroups(); const i=document.getElementById("gcName"); if(i) i.focus(); return; }
  if("gcreatex" in d){ comm.creating=false; renderGroups(); return; }
  if("greqopen" in d){ comm.reqFor=d.greqopen; renderGroups(); return; }
  if("greqx" in d){ comm.reqFor=null; renderGroups(); return; }
  if("gcancel" in d){ commDo(async()=>{ await gref(d.gcancel).collection("requests").doc(me).delete(); setMyGroups(myGroups().filter(x=>x.gid!==d.gcancel)); }, "Request cancelled."); return; }
  if("gconfirm" in d){ comm.confirm=d.gconfirm||null; renderGroups(); return; }
  if("gans" in d){ const id=d.gans; comm.open[id]=!comm.open[id]; renderGroups(); if(comm.open[id]) loadAnswers(id).catch(e=>{ comm.msg=commErr(e); renderGroups(); }); return; }
  if("gladder" in d){ const k="m:"+d.gladder; comm.open[k]=!comm.open[k]; renderGroups(); return; }
  if("gblock" in d){ blockUser(d.gblock); comm.msg="Hidden. You won't see posts or progress from this person in any group on this device."; renderGroups(); return; }
  if("greport" in d){ comm.reportFor=d.greport; renderGroups(); return; }
  if("greportx" in d){ comm.reportFor=null; renderGroups(); return; }
  if("gdel" in d){ const [kind,id,pid]=d.gdel.split(":"); comm.confirm=null;
    commDo(async()=>{ if(kind==="post"){ const pr=gref(comm.gid).collection("posts").doc(id); const a=await pr.collection("answers").get().catch(()=>({docs:[]})); for(const x of a.docs) await x.ref.delete().catch(()=>{}); await pr.delete(); }
      else { const pr=gref(comm.gid).collection("posts").doc(pid), b=sync.db.batch(); b.delete(pr.collection("answers").doc(id)); b.update(pr,{answerCount:FV().increment(-1)}); await b.commit(); await loadAnswers(pid); } }, "Deleted."); return; }
  if("gapprove" in d){ const r=comm.requests.find(x=>x.uid===d.gapprove); if(!r) return;
    commDo(async()=>{ const g=gref(comm.gid), b=sync.db.batch(); b.set(g.collection("members").doc(r.uid), {name:r.name, role:"member", joinedAt:FV().serverTimestamp()}); b.delete(g.collection("requests").doc(r.uid)); b.update(g, {memberCount:FV().increment(1)}); await b.commit(); }, `${r.name} joined the group.`); return; }
  if("gdecline" in d){ commDo(()=>gref(comm.gid).collection("requests").doc(d.gdecline).delete(), "Request declined."); return; }
  if("gremove" in d){ comm.confirm=null; commDo(async()=>{ const g=gref(comm.gid), b=sync.db.batch(); b.delete(g.collection("members").doc(d.gremove)); b.update(g,{memberCount:FV().increment(-1)}); await b.commit(); }, "Member removed."); return; }
  if("gleave" in d){ const gid=comm.gid; commDo(async()=>{ await leaveGroup(gid); setMyGroups(myGroups().filter(x=>x.gid!==gid)); closeGroup(); }, "You left the group."); return; }
  if("gdelgroup" in d){ const gid=comm.gid; comm.confirm=null; commUnsubscribe(); commDo(async()=>{ await deleteGroupAll(gid); setMyGroups(myGroups().filter(x=>x.gid!==gid)); comm.gid=null; comm.group=null; loadGroups(); }, "Group deleted."); return; }
  const item=t.closest("[data-id]"); if(item){ openModal(item.dataset.id); return; }
});
